# Publish the version already committed on main. Does not bump package.json.
# npm trusted publishing must name this file, publish-current.yml.
name: Publish current version

on:
    workflow_dispatch:

jobs:
    publish:
        name: 'Publish current version'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/release.yml
        with:
            bump: false
        secrets: inherit
