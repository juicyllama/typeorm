name: Retired publish current

on:
    workflow_dispatch:

jobs:
    retired:
        name: 'Use release.yml'
        runs-on: ubuntu-latest
        steps:
            -   name: 'Stop'
                run: |
                    echo "::error::Publish from the Release Package workflow (release.yml)."
                    exit 1
