#
# GitHub Actions workflow.
#
# Releases the package to npm when a push into main is detected.
# * Bump version number
# * Publish to npm via GitHub trusted publishing (OIDC). No npm token.
#

name: 'Release Package'

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:

    pr_checks:
        uses: ./.github/workflows/pr.yml
        secrets: inherit

    release:
        name: 'Release Package'
        runs-on: ubuntu-latest
        needs:
            - pr_checks
        permissions:
            contents: write
            id-token: write
        steps:
            -   name: 'Checkout'
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.GH_CI_CD_RELEASE }}

            -   name: 'Install Node.js'
                uses: actions/setup-node@v7
                with:
                    node-version: 24
                    registry-url: 'https://registry.npmjs.org/'

            -   name: 'Ensure npm supports trusted publishing'
                run: npm install --global npm@latest

            -   name: 'Install dependencies'
                run: npm install
                
            -   run: git stash
            -   run: git pull --force

            -   name: 'Configure git to skip hooks for release'
                run: git config core.hooksPath /dev/null

            -   name: 'Version Bump'
                uses: phips28/gh-action-bump-version@master
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_CI_CD_RELEASE }}
                with:
                    major-wording: 'major,breaking'
                    minor-wording: 'minor,feature,feat'
                    patch-wording: 'patch,fixes,fix,misc,docs,refactor,style,test,build,ci,chore,revert,perf'    # Providing patch-wording will override commits
                    commit-message: 'Release Package: Bump Version [skip ci]'
                    skip-tag: true

            -  name: 'Build'
               run: npm run build

            -   name: 'Verify trusted publishing environment'
                run: |
                    npm --version
                    if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
                      echo "::error::GitHub OIDC token is not available. Check the job has id-token: write."
                      exit 1
                    fi
                    echo "npm publish will authenticate via trusted publishing (OIDC)."

            -   name: 'Publish to npm (trusted publishing)'
                run: npm publish --access public
