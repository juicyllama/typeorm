#
# Shared npm publish. Callers decide whether to bump package.json first.
# npm trusted publishing checks the caller filename, not this file.
# Register publish-current.yml and release-package.yml on the package.
#

name: 'Release'

on:
    workflow_call:
        inputs:
            bump:
                description: 'Bump package.json from commit messages before publishing'
                required: true
                type: boolean

jobs:
    release:
        name: 'Publish to npm'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            -   name: 'Checkout'
                uses: actions/checkout@v7
                with:
                    token: ${{ secrets.GH_CI_CD_RELEASE }}

            -   name: 'Install Node.js'
                uses: actions/setup-node@v7
                with:
                    node-version: 24
                    registry-url: 'https://registry.npmjs.org/'
                    package-manager-cache: false

            -   name: 'Ensure npm supports trusted publishing'
                run: npm install --global npm@latest

            -   name: 'Install dependencies'
                run: npm install

            -   name: 'Prepare version bump'
                if: inputs.bump
                run: |
                    git stash
                    git pull --force
                    git config core.hooksPath /dev/null

            -   name: 'Version Bump'
                if: inputs.bump
                uses: phips28/gh-action-bump-version@master
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_CI_CD_RELEASE }}
                with:
                    major-wording: 'major,breaking'
                    minor-wording: 'minor,feature,feat'
                    patch-wording: 'patch,fixes,fix,misc,docs,refactor,style,test,build,ci,chore,revert,perf'
                    commit-message: 'Release Package: Bump Version [skip ci]'
                    skip-tag: true

            -   name: 'Build'
                run: npm run build

            -   name: 'Verify trusted publishing environment'
                run: |
                    npm --version
                    if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
                      echo "::error::GitHub OIDC token is not available. The caller and this workflow both need id-token: write."
                      exit 1
                    fi
                    echo "npm publish will authenticate via trusted publishing (OIDC)."

            -   name: 'Publish to npm (trusted publishing)'
                run: npm publish --access public
